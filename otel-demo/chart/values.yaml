# Images, pinned. The registry host is global.imageRegistry, set per environment
# (artifactory, image-registry:5000, or registry.local:5000 for kind). Empty leaves the
# repository as-is. Each image can set its own image.registry instead.
#   otel-poc/proxy:0.1.1
#   otel-poc/openobserve:v1.0.4
#   otel-poc/otelcol-contrib:0.161.0
global:
  imageRegistry: ""

imagePullSecrets: []
# - name: regcred

ingressClassName: nginx

# Applied to every pod. The PriorityClass must already exist on the cluster.
priorityClassName: mission-specific

# Applied to every pod. Meets the restricted Pod Security level.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  privileged: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }

# OpenObserve's data. Off by default: the pod uses an emptyDir and a restart deletes
# collected usage and replays. To keep it, set enabled and storageClass. On Env 3 also
# set local.enabled and one volume. local.createStorageClass is true on exactly one
# release in the cluster.
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  existingClaim: ""
  selector:
    matchLabels:
      app.kubernetes.io/instance: otel-poc
  local:
    enabled: false
    createStorageClass: false
    volumes: []
    # - { name: data-0, node: env-3-node-1, path: <LOCAL_PATH_DIR>/otel-poc/data-0 }

# Short label for the system these apps run on, attached to every span and RUM event.
environment: lab

# One entry per legacy app. Each gets its own hostname on the ingress; the proxy forwards to
# upstream and injects the browser script. upstream can be a cluster Service or anything the pods
# can reach, over http or https.
apps:
  - name: standin
    version: "1.0"
    host: standin.poc.local
    upstream: http://otel-poc-standin:8080
    # tlsSecret: standin-tls
    # Drop the app's Content-Security-Policy header if it blocks the injected script.
    stripCsp: false
    # Send the browser's host through. Next.js returns 403 on POST /api/auth when
    # Host has been replaced with the upstream address.
    # preserveHost: true
    # Optional: also serve this app on its own proxy port, so http://<proxy IP>:<port>/ works
    # without DNS or the ingress (for example on a Multus IP). Use 8081 and up.
    # port: 8081
  # - name: port-manager
  #   version: "4.2"
  #   host: port-manager.poc.local
  #   upstream: https://port-manager.lab.example:8443
  # Demo apps. name must match the app column in feature_catalog.csv.
  # - name: redpanda-console
  #   version: "3.9.0"
  #   host: console.poc.local
  #   upstream: http://<console service>.<namespace>:8080
  #   port: 8082
  # - name: headlamp
  #   version: "0.44.0"
  #   host: headlamp.poc.local
  #   upstream: http://<headlamp service>.<namespace>:4466
  #   port: 8083
  #   # Overrides openobserve.privacyLevel for this app. Headlamp shows Secrets and a token
  #   # login, so mask all text in replays.
  #   privacy: mask

# Small two-page app for checking the install before pointing at a real one.
# Uses the proxy image.
standin:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

openobserve:
  image:
    registry: ""
    repository: otel-poc/openobserve
    tag: "v1.0.4"
    pullPolicy: IfNotPresent
  host: openobserve.poc.local
  # tlsSecret: openobserve-tls
  rootEmail: admin@poc.local
  rootPassword: ChangeMe-PoC-1
  org: default
  # How the proxy and collector reach OpenObserve. Empty uses the cluster Service.
  # If `kubectl get endpoints otel-poc-openobserve` is empty but the Multus UI works,
  # set this to http://<OpenObserve Multus IP>:5080.
  url: ""
  # allow: record everything; mask-user-input: mask typed values; mask: mask all text.
  privacyLevel: allow
  # One static IP for this pod. Leave ips empty in the chart; set it in the environment
  # values. The chart will not render while enabled is true and ips is empty.
  networkAttachments:
    enabled: false
    networks: []
    # - { name: <nad>, namespace: <namespace>, ips: ["<ip>/<prefix>"] }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }

collector:
  image:
    registry: ""
    repository: otel-poc/otelcol-contrib
    tag: "0.161.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

proxy:
  image:
    registry: ""
    repository: otel-poc/proxy
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  replicas: 1
  # Port on the proxy that forwards OTLP/HTTP (/v1/traces, /v1/logs, /v1/metrics) to the Collector,
  # for Java desktop apps running ui-agent. They point UI_AGENT_ENDPOINT at
  # http://<proxy IP or host>:4318. Empty turns it off.
  otlpPort: 4318
  # One static IP for this pod. Requires replicas: 1. Same shape as
  # openobserve.networkAttachments. The proxy and OpenObserve do not share an IP.
  networkAttachments:
    enabled: false
    networks: []
    # - { name: <nad>, namespace: <namespace>, ips: ["<ip>/<prefix>"] }
  # Hosts-file entries for upstreams the cluster DNS can't resolve, such as bare metal boxes.
  # nginx resolves every upstream at startup, so one unknown name crash-loops the proxy.
  hostAliases: []
  # - ip: 10.1.2.3
  #   hostnames: [sysvue]
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }
