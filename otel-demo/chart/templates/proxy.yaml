{{- if and .Values.proxy.networkAttachments.enabled (ne (int .Values.proxy.replicas) 1) }}
{{- fail "proxy.networkAttachments pins one IP, so proxy.replicas must be 1" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proxy
spec:
  selector: { app: {{ .Release.Name }}-proxy }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
    {{- with .Values.proxy.otlpPort }}
    - { name: otlp, port: {{ . }}, targetPort: {{ . }} }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-proxy }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-proxy }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/proxy-config.yaml") . | sha256sum }}
        {{- include "otel-poc.networks" .Values.proxy.networkAttachments | nindent 8 }}
    spec:
      priorityClassName: {{ required "priorityClassName is required" .Values.priorityClassName | quote }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "otel-poc.image" (dict "root" . "image" .Values.proxy.image) }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { containerPort: 8080 }
            {{- with .Values.proxy.otlpPort }}
            - { containerPort: {{ . }} }
            {{- end }}
            {{- range .Values.apps }}
            {{- with .port }}
            - { containerPort: {{ . }} }
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources: {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          secret: { secretName: {{ .Release.Name }}-proxy }
        - name: tmp
          emptyDir: {}
