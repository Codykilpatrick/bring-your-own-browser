# The attach matrix. Every service runs one app on one JDK with one attach mode and reports to the
# Collector on the Mac (kubectl port-forward 4318). Watch any of them in a browser on its noVNC port.
#
#   ./run-matrix.sh            # up, drive every app through its scenario, then ./verify.sh
#   docker compose up -d sonar-jdk7-a && docker compose exec sonar-jdk7-a sh /scenarios/sonar-console.sh
#
# UI_AGENT_ENV tells the runs apart in OpenObserve (deployment_environment_name).
x-common: &common
  platform: linux/amd64
  volumes:
    - ./sonar-console/dist:/app/sonar-console:ro
    - ./fire-control/dist:/app/fire-control:ro
    - ../ui-agent/dist:/agent:ro
    - ./scenarios:/scenarios:ro
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &env
    UI_AGENT_ENDPOINT: ${UI_AGENT_ENDPOINT:-http://host.docker.internal:4318}
    UI_AGENT_DEBUG: "true"
  shm_size: 512m

services:
  # Mode A: -javaagent on the command line
  sonar-jdk7-a:
    <<: *common
    image: java-apps/jdk7:latest
    ports: ["6081:6080"]
    environment:
      <<: *env
      UI_AGENT_APP: sonar-console
      UI_AGENT_ENV: jdk7-a
    command: [java, -javaagent:/agent/ui-agent.jar, -jar, /app/sonar-console/sonar-console.jar]

  # Mode B: JAVA_TOOL_OPTIONS only, launch command untouched
  sonar-jdk6-b:
    <<: *common
    image: java-apps/jdk6:latest
    ports: ["6082:6080"]
    environment:
      <<: *env
      UI_AGENT_APP: sonar-console
      UI_AGENT_ENV: jdk6-b
      JAVA_TOOL_OPTIONS: -javaagent:/agent/ui-agent.jar
    command: [java, -jar, /app/sonar-console/sonar-console.jar]

  # Mode C: attach to the running JVM after ATTACH_DELAY seconds
  sonar-jdk8-c:
    <<: *common
    image: java-apps/jdk8:latest
    ports: ["6083:6080"]
    environment:
      <<: *env
      UI_AGENT_APP: sonar-console
      UI_AGENT_ENV: jdk8-c
      ATTACH_DELAY: "15"
    command: [/scenarios/run-attach.sh, java, -jar, /app/sonar-console/sonar-console.jar]

  fc-jdk8fx-b:
    <<: *common
    image: java-apps/jdk8fx:latest
    ports: ["6084:6080"]
    environment:
      <<: *env
      UI_AGENT_APP: fire-control
      UI_AGENT_ENV: jdk8fx-b
      JAVA_TOOL_OPTIONS: -javaagent:/agent/ui-agent.jar
    command: [java, -jar, /app/fire-control/fire-control.jar]

  fc-jdk17fx-c:
    <<: *common
    image: java-apps/jdk17fx:latest
    ports: ["6085:6080"]
    environment:
      <<: *env
      UI_AGENT_APP: fire-control
      UI_AGENT_ENV: jdk17fx-c
      ATTACH_DELAY: "15"
    command: [/scenarios/run-attach.sh, java, --module-path, /opt/javafx/lib, --add-modules, javafx.controls, -jar, /app/fire-control/fire-control.jar]

  # Mode A with the official OpenTelemetry Java agent loaded next to ui-agent, to see if they coexist.
  # Needs ../ui-agent/dist/opentelemetry-javaagent.jar (run-matrix.sh downloads v2.33.1 when missing).
  fc-jdk8fx-otel:
    <<: *common
    image: java-apps/jdk8fx:latest
    ports: ["6086:6080"]
    profiles: [otel]
    environment:
      <<: *env
      UI_AGENT_APP: fire-control
      UI_AGENT_ENV: jdk8fx-otel
      OTEL_SERVICE_NAME: fire-control
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=jdk8fx-otel
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UI_AGENT_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    command: [java, -javaagent:/agent/ui-agent.jar, -javaagent:/agent/opentelemetry-javaagent.jar, -jar, /app/fire-control/fire-control.jar]
