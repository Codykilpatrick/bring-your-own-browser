# Connected-side test apps for kind only. Not part of the chart or the transfer; the high side
# already runs both. Versions match the ones used elsewhere on this Mac; confirm against the high side.
apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: demo }
spec:
  selector: { app: redpanda }
  ports: [{ name: kafka, port: 9092 }, { name: admin, port: 9644 }, { name: schema, port: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, namespace: demo }
spec:
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args: [redpanda, start, --mode, dev-container, --smp, "1", --overprovisioned,
                 --kafka-addr, "0.0.0.0:9092", --advertise-kafka-addr, "redpanda.demo:9092"]
---
apiVersion: v1
kind: Service
metadata: { name: console, namespace: demo }
spec:
  selector: { app: console }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: console, namespace: demo }
spec:
  selector: { matchLabels: { app: console } }
  template:
    metadata: { labels: { app: console } }
    spec:
      containers:
        - name: console
          image: redpandadata/console:v3.9.0
          env:
            - { name: KAFKA_BROKERS, value: "redpanda.demo:9092" }
            - { name: REDPANDA_ADMINAPI_ENABLED, value: "true" }
            - { name: REDPANDA_ADMINAPI_URLS, value: "http://redpanda.demo:9644" }
            - { name: SCHEMAREGISTRY_ENABLED, value: "true" }
            - { name: SCHEMAREGISTRY_URLS, value: "http://redpanda.demo:8081" }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: headlamp, namespace: demo }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: demo-headlamp }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects: [{ kind: ServiceAccount, name: headlamp, namespace: demo }]
---
apiVersion: v1
kind: Service
metadata: { name: headlamp, namespace: demo }
spec:
  selector: { app: headlamp }
  ports: [{ name: http, port: 4466 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: headlamp, namespace: demo }
spec:
  selector: { matchLabels: { app: headlamp } }
  template:
    metadata: { labels: { app: headlamp } }
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.44.0
          args: [-in-cluster, -plugins-dir=/headlamp/plugins]
