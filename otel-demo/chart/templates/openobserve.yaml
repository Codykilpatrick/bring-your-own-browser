{{- $o := .Values.openobserve }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-openobserve
stringData:
  ZO_ROOT_USER_EMAIL: {{ $o.rootEmail | quote }}
  ZO_ROOT_USER_PASSWORD: {{ $o.rootPassword | quote }}
  O2_BASIC_AUTH: {{ printf "%s:%s" $o.rootEmail $o.rootPassword | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openobserve
spec:
  selector: { app: {{ .Release.Name }}-openobserve }
  ports:
    - { name: http, port: 5080, targetPort: 5080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openobserve
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-openobserve }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-openobserve }
      annotations:
        checksum/secret: {{ printf "%s%s" $o.rootEmail $o.rootPassword | sha256sum }}
        {{- include "otel-poc.networks" $o.networkAttachments | nindent 8 }}
    spec:
      priorityClassName: {{ required "priorityClassName is required" .Values.priorityClassName | quote }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: openobserve
          image: {{ include "otel-poc.image" (dict "root" . "image" $o.image) }}
          imagePullPolicy: {{ $o.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: ZO_DATA_DIR, value: /data }
            - { name: ZO_TELEMETRY, value: "false" }
            - { name: ZO_WEB_URL, value: "http://{{ $o.host }}" }
          envFrom:
            - secretRef: { name: {{ .Release.Name }}-openobserve }
          ports:
            - { containerPort: 5080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 5080 }
          resources: {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" .Release.Name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
