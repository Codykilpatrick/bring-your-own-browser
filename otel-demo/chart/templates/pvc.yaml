{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ required "persistence.storageClass is required when persistence.enabled is true" .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.local.enabled }}
  selector:
    matchLabels:
      {{- toYaml .Values.persistence.selector.matchLabels | nindent 6 }}
  {{- end }}
{{- end }}
