# Settings for every Java app on this machine, read by:
#   java -jar ui-agent.jar attach-all /opt/ui-agent/apps.conf
# Edit the values, add one section per app, and delete the examples you don't need.

# Lines above the first section apply to every app.
endpoint = http://<proxy IP or host>:4318
env = <site>

# One section per app. The name in brackets is the app name in OpenObserve.
# match is text found in the app's line from "java -jar ui-agent.jar list": part of its jar
# path or its main class. The first section that matches wins. JVMs that match nothing are
# left alone.
[sonar-console]
match = sonar-console.jar
version = 4.2

[plot-editor]
match = com.example.plot.Main
# Window titles that carry a file name or a number would each count as a separate screen.
# title_trim is a regular expression; whatever it matches in a title becomes "*".
# "Plot Editor - north.plt" and "Track 0042" become "Plot Editor*" and "Track *".
title_trim = \s+-\s.*$|\d+
