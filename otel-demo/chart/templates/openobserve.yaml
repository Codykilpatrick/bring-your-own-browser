{{- $o := .Values.openobserve }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-openobserve
stringData:
  ZO_ROOT_USER_EMAIL: {{ $o.rootEmail | quote }}
  ZO_ROOT_USER_PASSWORD: {{ $o.rootPassword | quote }}
  O2_BASIC_AUTH: {{ printf "%s:%s" $o.rootEmail $o.rootPassword | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openobserve
spec:
  selector: { app: {{ .Release.Name }}-openobserve }
  ports:
    - { name: http, port: 5080, targetPort: 5080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openobserve
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-openobserve }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-openobserve }
      annotations:
        checksum/secret: {{ printf "%s%s" $o.rootEmail $o.rootPassword | sha256sum }}
        {{- if $o.networkAttachments.enabled }}
        k8s.v1.cni.cncf.io/networks: {{ toJson $o.networkAttachments.entries | quote }}
        {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with $o.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openobserve
          image: {{ .Values.registry }}/openobserve:v1.0.4
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: ZO_DATA_DIR, value: /data }
            - { name: ZO_TELEMETRY, value: "false" }
            - { name: ZO_WEB_URL, value: "http://{{ $o.host }}" }
          envFrom:
            - secretRef: { name: {{ .Release.Name }}-openobserve }
          ports:
            - { containerPort: 5080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 5080 }
          resources: {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          {{- if $o.hostPath }}
          hostPath: { path: {{ $o.hostPath }}, type: DirectoryOrCreate }
          {{- else }}
          emptyDir: {}
          {{- end }}
